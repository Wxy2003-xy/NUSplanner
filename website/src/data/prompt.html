<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module Fetch</title>
</head>
<body>
    <h1>Fetch Module Information</h1>
    <form id="moduleForm">
        <label for="acadYear">Academic Year (e.g., 2023-2024):</label>
        <input type="text" id="acadYear" name="acadYear" required>
        <label for="moduleCode">Module Code (e.g., CS1101S):</label>
        <input type="text" id="moduleCode" name="moduleCode" required>
        <button type="submit">Fetch Module Info</button>
    </form>
    <pre id="moduleInfo"></pre>

    <script src="app.js"></script>
</body>
</html>
